# Publishes the web app (the kai/ folder) to GitHub Pages. It never runs by itself:
# open Actions → "Publish web app" → Run workflow, and pick the branch to publish.
# Once: Settings → Pages → Source: "GitHub Actions".
name: Publish web app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: App tests must pass first
        run: node --test tests/app.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kai
      - id: deploy
        uses: actions/deploy-pages@v4
