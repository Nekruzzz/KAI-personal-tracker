<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAI</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KAI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:#1c1c1e;
  --card-2:#2a2a2d;
  --line:#2f3033;
  --text:#f4f5f4;
  --text-2:#a2a6aa;
  --text-3:#6d7175;
  --accent:#2ebd6b;
  --accent-ink:#04140a;
  --accent-soft:#1d3527;
  --good:#2ebd6b;
  --warn:#e8a33d;
  --bad:#ef5b56;
  --sick:#8f86e8;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c0:#5d6166;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --font:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.resting .app{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.top{position:relative;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;background:linear-gradient(180deg,#123a3f 0%,#0b2226 45%,#000 100%)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background:radial-gradient(circle at 70% 30%,#7fd1d8 0 18%,transparent 19%),radial-gradient(circle at 45% 12%,#7fd1d8 0 7%,transparent 8%)}
.top.plain{background:none}
.top.plain::after{display:none}
.ptitle{font-size:32px;font-weight:800;margin:14px 0 0;letter-spacing:-.01em}
.hdr{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ava{width:44px;height:44px;border-radius:50%;background:#2e5b3a;display:grid;place-items:center;font-weight:800;font-size:18px;color:#d8f5e2;flex:none}
.hname{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:700}
.hname svg{width:18px;height:18px}
.hsp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.seasonchip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.view{padding:16px 16px 0;display:flex;flex-direction:column;gap:18px}
.top + .view{padding-top:14px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px}
.hero{padding:20px 20px 14px}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero-sub{color:var(--text-2);font-size:15px;margin-top:4px}
.hero-row{display:flex;align-items:center;gap:14px}
.hero-row .grow{flex:1;min-width:0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.actions button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:4px 2px}
.actions button + button{border-left:1px solid var(--line)}
.actions svg{width:26px;height:26px;color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px -6px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;color:#d9dcdf}
.sec-h a,.link{color:var(--accent);font-weight:600;font-size:14.5px;cursor:pointer;background:none;border:0}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:999px;background:var(--card-2);font-weight:600;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pill > svg{width:16px;height:16px}
.pill.on{background:#fff;color:#000}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row > svg{width:20px;height:20px;flex:none;color:var(--text-3)}
.row .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.row .ic svg{width:22px;height:22px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row .s{color:var(--text-2);font-size:13.5px;margin-top:1px}
.row .r{text-align:right;font-weight:700;white-space:nowrap}
.row .r small{display:block;font-weight:500;color:var(--text-2);font-size:12.5px}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid #4a4d51;display:grid;place-items:center;flex:none;position:relative;transition:background .2s,border-color .2s,transform .14s}
.chk svg{width:18px;height:18px;opacity:0}
.chk.on{background:linear-gradient(135deg,#2ebd6b,#7bd64a);border-color:transparent;color:var(--accent-ink)}
.chk.on svg{opacity:1}
.chk.miss{border-color:var(--bad)}
.task.done .t{color:var(--text-2);text-decoration:line-through;text-decoration-color:#555}
.detail{background:#141416;border-radius:var(--r-md);padding:12px 14px;margin:0 0 12px 44px;font-size:14px;color:#d4d7da;display:flex;flex-direction:column;gap:6px}
.detail b{color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card-2);color:var(--text-2)}
.tag.good{background:#173323;color:#6fdc9b}.tag.warn{background:#3a2c12;color:#f0c170}.tag.bad{background:#3a1717;color:#ff8f8a}.tag.sick{background:#262249;color:#b9b2ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--card);border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.mini .lbl{color:var(--text-2);font-size:13.5px}
.mini .val{font-size:20px;font-weight:800;margin-top:2px}
.mini.on{outline:2px solid #3a3d41}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:8px 0;border-radius:14px}
.wd.today{background:var(--card-2);color:var(--text)}
.wd .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--text)}
.wd .dot svg{width:15px;height:15px;stroke-width:3;color:#04140a}
.wd.today .dot{box-shadow:0 0 0 2px #000,0 0 0 3.5px rgba(255,255,255,.35)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:#232326;display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:#141416;border-radius:14px;padding:10px 12px}
.stat3 b{display:block;font-size:19px;font-weight:800}
.stat3 span{font-size:12px;color:var(--text-2)}
.stat3 .st-ic{display:flex;height:22px;align-items:flex-end;margin-bottom:6px}
.stat3 .st-ic svg{width:18px;height:18px}
.bar{height:8px;border-radius:99px;background:#2b2c2f;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.macro{display:grid;grid-template-columns:92px 1fr 88px;gap:10px;align-items:center;font-size:14px}
.macro .n{text-align:right;color:var(--text-2)}
.macro .n b{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--card-2);color:var(--text)}
.btn.danger{background:#3a1717;color:#ff8f8a}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--text-2);font-weight:600}
.in{width:100%;background:#141416;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15.5px;outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:96px;resize:vertical;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.set{display:flex;align-items:center;gap:2px;background:#141416;border:1px solid var(--line);border-radius:10px;padding:3px 6px}
.set input{width:44px;background:none;border:0;text-align:center;padding:6px 0;font-weight:700;outline:none}
.set span{color:var(--text-3);font-size:12px}
.hint{font-size:13px;color:var(--text-2)}
.hint.good{color:#6fdc9b}
.muted{color:var(--text-2)}
.note{font-size:13px;color:var(--text-2);background:#141416;border-radius:12px;padding:10px 12px}
.banner{display:flex;gap:12px;align-items:flex-start;background:#2a2112;color:#f3d7a4;border-radius:var(--r-md);padding:14px}
.banner svg{width:22px;height:22px;flex:none;margin-top:1px}
.banner .btnrow{margin-top:10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#000;border:1px solid #3a3d41;border-radius:10px;padding:6px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--text-2);text-align:center;padding:20px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .e-ic{width:52px;height:52px;border-radius:16px;background:#232326;display:grid;place-items:center;color:var(--text-3)}
.empty .e-ic svg{width:26px;height:26px}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.ai-list{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:#141416;border-radius:12px;padding:9px 11px}
.kv span{display:block;font-size:12px;color:var(--text-2)}
.kv b{font-size:16px}
.pbadge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.step{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-child{border-top:0}
.step .tm{color:var(--accent);font-weight:700}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1c1c1e;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #26272a}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8d9195;padding:4px 0}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--accent)}
.nav .mic{margin-top:-26px}
.nav .mic span.b{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 6px #000}
.nav .mic span.b svg{width:28px;height:28px}
/* sheet */
.scrim{position:fixed;inset:0;padding-top:calc(24px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#111113;width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:#3a3d41;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h3{margin:0;font-size:20px;font-weight:800;flex:1;text-wrap:balance}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232427;color:var(--text);border:1px solid #34363a;box-shadow:0 12px 32px rgba(0,0,0,.55);font-weight:700;padding:10px 16px 10px 10px;border-radius:16px;z-index:70;font-size:14.5px;max-width:92%;width:max-content;display:flex;align-items:center;gap:10px;animation:toastIn .38s cubic-bezier(.2,1.25,.3,1)}
.toast .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#2f3134;flex:none;line-height:0}
.toast .ti svg{width:18px;height:18px}
.toast.tn-good .ti{background:var(--accent-soft);color:var(--accent)}
.toast.tn-gold .ti{background:#3a2e0e;color:#ffd84d}
.toast.tn-fire .ti{background:#3a220f}
.toast.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.97)}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#1c1c1e;border-radius:12px;padding:3px}
.seg button{padding:8px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--text-2)}
.seg button.on{background:#3a3b3f;color:var(--text)}
.aibtn{position:relative}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.seg button[disabled]{opacity:.35}
.t-good{color:#6fdc9b}.t-warn{color:#f0c170}.t-bad{color:#ff8f8a}
.mbar{position:relative;height:10px;border-radius:99px;background:#2b2c2f}
.mbar .zone{position:absolute;top:0;bottom:0;background:rgba(46,189,107,.18);border-left:1px solid rgba(46,189,107,.5);border-right:1px solid rgba(46,189,107,.5)}
.mbar .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:99px}
.mbar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-3);border-radius:2px}
.restbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 12px}
.restbar > .rb-in, .restbar > .bar{max-width:456px;margin-left:auto;margin-right:auto}
.restbar{background:transparent}
.rb-in{display:flex;align-items:center;gap:8px;background:#26352c;border:1px solid #2f5a3f;border-radius:16px;padding:10px 12px}
.rb-t{font-size:26px;font-weight:800;line-height:1}
.rb-in .btn{padding:10px 12px}
/* ---- v3: feel ---- */
.hap{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1}
.fxl{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.fxl .spark{position:absolute;border-radius:50%;will-change:transform,opacity}
.fxl .spark.sq{border-radius:2px}
.fxl canvas.confetti{position:absolute;inset:0;width:100%;height:100%}
button{-webkit-tap-highlight-color:transparent}
.btn,.pill,.mini,.iconbtn,.actions button,.seg button,.shelf-b,.streak,.seasonchip,.ava{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,color .2s,opacity .2s}
.btn:active,.pill:active,.mini:active,.iconbtn:active,.actions button:active,.seg button:active,.shelf-b:active,.streak:active,.seasonchip:active{transform:scale(.95)}
.chk:active{transform:scale(.86)}
button.row:active,.task .mid:active{opacity:.65}
.nav button .nb{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .25s,transform .18s}
.nav button.on .nb{background:rgba(46,189,107,.16)}
.nav button:active .nb{transform:scale(.88)}
.nav .mic span.b{box-shadow:0 0 0 6px #000,0 8px 24px rgba(46,189,107,.45);transition:transform .15s}
.nav .mic:active span.b{transform:scale(.9)}
.dayhero{background:radial-gradient(120% 90% at 100% 0%,rgba(46,189,107,.17),transparent 55%),var(--card);position:relative;overflow:hidden}
.dayhero.perfect{background:radial-gradient(120% 90% at 100% 0%,rgba(255,200,60,.24),transparent 60%),var(--card)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.greet{color:var(--text-2);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-num .of{font-size:22px;color:var(--text-2);font-weight:700;letter-spacing:0}
.tag.gold{background:#3a2e0e;color:#ffd84d}
.stars{letter-spacing:1px;color:#ffd84d}.stars i{font-style:normal;color:#4a4d51}
.ring.full{filter:drop-shadow(0 0 10px rgba(255,200,60,.35))}
.streak{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:999px;background:#242426;border:1px solid #333538;font-size:16px;flex:none}
.streak b{font-weight:800}
.streak.on{background:linear-gradient(135deg,#3d230f,#2a190b);border-color:#6b3a14;box-shadow:0 0 20px rgba(255,120,30,.2)}
.streak.pulse{animation:chipPulse 1.1s ease-out}
@keyframes chipPulse{0%{box-shadow:0 0 0 0 rgba(255,140,40,.65)}100%{box-shadow:0 0 0 18px rgba(255,140,40,0)}}
.flame{display:inline-block;position:relative;flex:none;line-height:0}
.flame svg{width:100%;height:100%;overflow:visible}
.flame .fo,.flame .fi{transform-box:fill-box;transform-origin:50% 100%}
.flame.lit .fo{animation:flk 1.7s ease-in-out infinite}
.flame.lit .fi{animation:flk2 1.05s ease-in-out infinite}
.flame.lit{filter:drop-shadow(0 0 5px rgba(255,130,30,.6))}
.flame.lv2.lit{filter:drop-shadow(0 0 8px rgba(255,90,20,.75))}
.flame.lv3.lit{filter:drop-shadow(0 0 8px rgba(80,170,255,.75))}
.flame.dim{opacity:.5;filter:saturate(.5)}
.flame.dim .fo{animation-duration:3.2s}
.flame.ignite{animation:ign .95s cubic-bezier(.2,1.5,.4,1)}
@keyframes flk{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.96,1.06) skewX(-2.5deg)}50%{transform:scale(1.03,.95) skewX(2deg)}75%{transform:scale(.98,1.04) skewX(-1deg)}}
@keyframes flk2{0%,100%{transform:scale(1)}50%{transform:scale(.88,1.12)}}
@keyframes ign{0%{transform:scale(.2);filter:brightness(3) drop-shadow(0 0 12px #ffb040)}55%{transform:scale(1.4)}100%{transform:scale(1)}}
.tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 20%,transparent);color:var(--tc);transition:opacity .3s,filter .3s}
.tic svg{width:20px;height:20px}
.task.done .tic{opacity:.45;filter:saturate(.3)}
.task .mid{flex:1;min-width:0}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:0}
