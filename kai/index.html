  --text:#f4f5f4;

  --good-bg:#173323;--good-ink:#6fdc9b;
  --warn-bg:#3a2c12;--warn-ink:#f0c170;
  --bad-bg:#3a1717;--bad-ink:#ff8f8a;
  --sick-bg:#262249;--sick-ink:#b9b2ff;
  --gold-bg:#3a2e0e;--gold-ink:#ffd84d;
  --note-bg:#2a2112;--note-ink:#f3d7a4;
  --ev-bg:#1f1d33;--ev-ink:#d9d5ff;

}

/* the status bar text stays white (the iPhone app and the installed web app both ask for that), so keep a dark strip behind it */
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0b2226;z-index:40}}
:root[data-theme=light] body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0b2226;z-index:40}

*{box-sizing:border-box}
[hidden]{display:none!important} /* a class's display must never undo hidden */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.resting .app{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.top{position:relative;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;background:linear-gradient(180deg,var(--top-a) 0%,var(--top-b) 45%,var(--bg) 100%)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background:radial-gradient(circle at 70% 30%,var(--top-dots) 0 18%,transparent 19%),radial-gradient(circle at 45% 12%,var(--top-dots) 0 7%,transparent 8%)}
.top.plain{background:none}
.top.plain::after{display:none}
.ptitle{font-size:32px;font-weight:800;margin:14px 0 0;letter-spacing:-.01em}
.hdr{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ava{width:44px;height:44px;border-radius:50%;background:var(--ava);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--ava-ink);flex:none}
.hname{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:700}
.hname svg{width:18px;height:18px}
.hsp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.seasonchip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.view{padding:16px 16px 0;display:flex;flex-direction:column;gap:18px}
.top + .view{padding-top:14px}
.card{background:var(--mat,var(--card));border-radius:var(--r-lg);padding:18px;box-shadow:inset 0 0 0 1px var(--mat-line,transparent),var(--mat-drop,0 0 #0000)}
.hero{padding:20px 20px 14px}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero-sub{color:var(--text-2);font-size:15px;margin-top:4px}
.hero-row{display:flex;align-items:center;gap:14px}
.hero-row .grow{flex:1;min-width:0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.actions button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:4px 2px}
.actions button + button{border-left:1px solid var(--line)}
.actions svg{width:26px;height:26px;color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px -6px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;color:var(--h2)}
.sec-h a,.link{color:var(--accent);font-weight:600;font-size:14.5px;cursor:pointer;background:none;border:0}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:22px;background:var(--card-2);font-weight:600;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pill > svg{width:16px;height:16px}
.pill.on{background:var(--pill-on);color:var(--pill-on-ink)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row > svg{width:20px;height:20px;flex:none;color:var(--text-3)}
.row .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.row .ic svg{width:22px;height:22px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row .s{color:var(--text-2);font-size:13.5px;margin-top:1px}
.row .r{text-align:right;font-weight:700;white-space:nowrap}
.row .r small{display:block;font-weight:500;color:var(--text-2);font-size:12.5px}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;flex:none;position:relative;transition:background .2s,border-color .2s,transform .14s}
.chk svg{width:18px;height:18px;opacity:0}
.chk.on{background:linear-gradient(135deg,#2ebd6b,#7bd64a);border-color:transparent;color:#04140a}
.chk.on svg{opacity:1}
.chk.miss{border-color:var(--bad)}
.task.done .t{color:var(--text-2);text-decoration:line-through;text-decoration-color:var(--text-3)}
.detail{background:var(--sunk);border-radius:var(--r-md);padding:12px 14px;margin:0 0 12px 44px;font-size:14px;color:var(--text-soft);display:flex;flex-direction:column;gap:6px}
.detail b{color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card-2);color:var(--text-2);white-space:nowrap;flex:none}
.tag.good{background:var(--good-bg);color:var(--good-ink)}.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}.tag.sick{background:var(--sick-bg);color:var(--sick-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--card);border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.mini .lbl{color:var(--text-2);font-size:13.5px}
.mini .val{font-size:20px;font-weight:800;margin-top:2px}
.mini.on{outline:2px solid var(--edge)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:8px 0;border-radius:14px}
.wd.today{background:var(--card-2);color:var(--text)}
.wd .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--text)}
.wd .dot svg{width:15px;height:15px;stroke-width:3;color:#04140a}
.wd.today .dot{box-shadow:0 0 0 2px var(--ring-gap),0 0 0 3.5px var(--edge)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--track-2);display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--sunk);border-radius:14px;padding:10px 12px}
.stat3 b{display:block;font-size:19px;font-weight:800}
.stat3 span{font-size:12px;color:var(--text-2)}
.stat3 .st-ic{display:flex;height:22px;align-items:flex-end;margin-bottom:6px}
.stat3 .st-ic svg{width:18px;height:18px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.macro{display:grid;grid-template-columns:92px 1fr 88px;gap:10px;align-items:center;font-size:14px}
.macro .n{text-align:right;color:var(--text-2)}
.macro .n b{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.btn svg{width:20px;height:20px;flex:none} /* an icon keeps its size when the label wraps */
.btn.ghost{background:var(--card-2);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--text-2);font-weight:600}
.in{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15.5px;outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:96px;resize:vertical;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.set{display:flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px 6px}
.set input{width:44px;background:none;border:0;text-align:center;padding:6px 0;font-weight:700;outline:none}
.set span{color:var(--text-3);font-size:12px}
.hint{font-size:13px;color:var(--text-2)}
.hint.good{color:var(--good-ink)}
.muted{color:var(--text-2)}
.note{font-size:13px;color:var(--text-2);background:var(--sunk);border-radius:12px;padding:10px 12px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--note-bg);color:var(--note-ink);border-radius:var(--r-md);padding:14px}
.banner svg{width:22px;height:22px;flex:none;margin-top:1px}
.banner .btnrow{margin-top:10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:6px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--text-2);text-align:center;padding:20px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .e-ic{width:52px;height:52px;border-radius:16px;background:var(--track-2);display:grid;place-items:center;color:var(--text-3)}
.empty .e-ic svg{width:26px;height:26px}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.ai-list{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:12px;padding:9px 11px}
.kv span{display:block;font-size:12px;color:var(--text-2)}
.kv b{font-size:16px}
.pbadge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.step{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-child{border-top:0}
.step .tm{color:var(--accent);font-weight:700}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--nav-line)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--nav-ink);padding:4px 0}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--accent)}
.nav .mic{margin-top:-26px}
.nav .mic span.b{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 6px var(--ring-gap)}
.nav .mic span.b svg{width:28px;height:28px}
/* sheet */
.scrim{position:fixed;inset:0;padding-top:calc(24px + env(safe-area-inset-top,0px));background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--edge);margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h2{margin:0;font-size:20px;font-weight:800;flex:1;text-wrap:balance}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:var(--text);border:1px solid var(--toast-line);box-shadow:0 12px 32px rgba(0,0,0,.25);font-weight:700;padding:10px 16px 10px 10px;border-radius:16px;z-index:70;font-size:14.5px;max-width:92%;width:max-content;display:flex;align-items:center;gap:10px;animation:toastIn .38s cubic-bezier(.2,1.25,.3,1)}
.toast .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--toast-ic);flex:none;line-height:0}
.toast .ti svg{width:18px;height:18px}
.toast.tn-good .ti{background:var(--accent-soft);color:var(--accent)}
.toast.tn-gold .ti{background:var(--gold-bg);color:var(--gold-ink)}
.toast.tn-fire .ti{background:var(--streak-on-a)}
.toast.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.97)}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg);border-radius:12px;padding:3px}
.seg button{padding:8px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--text-2)}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.aibtn{position:relative}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.seg button[disabled]{opacity:.35}
.t-good{color:var(--good-ink)}.t-warn{color:var(--warn-ink)}.t-bad{color:var(--bad-ink)}
.mbar{position:relative;height:10px;border-radius:99px;background:var(--track)}
.mbar .zone{position:absolute;top:0;bottom:0;background:rgba(46,189,107,.18);border-left:1px solid rgba(46,189,107,.5);border-right:1px solid rgba(46,189,107,.5)}
.mbar .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:99px}
.mbar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-3);border-radius:2px}
.restbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 12px}
.restbar > .rb-in, .restbar > .bar{max-width:456px;margin-left:auto;margin-right:auto}
.restbar{background:transparent}
.rb-in{display:flex;align-items:center;gap:8px;background:var(--rb);border:1px solid var(--rb-line);border-radius:16px;padding:10px 12px}
.rb-t{font-size:26px;font-weight:800;line-height:1}
.rb-in .btn{padding:10px 12px}
/* ---- v3: feel ---- */
.hap{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1}
.fxl{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.fxl .spark{position:absolute;border-radius:50%;will-change:transform,opacity}
.fxl .spark.sq{border-radius:2px}
.fxl canvas.confetti{position:absolute;inset:0;width:100%;height:100%}
button{-webkit-tap-highlight-color:transparent}
.btn,.pill,.mini,.iconbtn,.actions button,.seg button,.shelf-b,.streak,.seasonchip,.ava{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,color .2s,opacity .2s}
.btn:active,.pill:active,.mini:active,.iconbtn:active,.actions button:active,.seg button:active,.shelf-b:active,.streak:active,.seasonchip:active{transform:scale(.95)}
.chk:active{transform:scale(.86)}
button.row:active,.task .mid:active{opacity:.65}
.nav button .nb{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .25s,transform .18s}
.nav button.on .nb{background:rgba(46,189,107,.16)}
.nav button:active .nb{transform:scale(.88)}
.nav .mic span.b{box-shadow:0 0 0 6px var(--ring-gap),0 8px 24px rgba(46,189,107,.45);transition:transform .15s}
.nav .mic:active span.b{transform:scale(.9)}
.dayhero{background:radial-gradient(120% 90% at 100% 0%,rgba(46,189,107,.17),transparent 55%),var(--card);position:relative;overflow:hidden}
.dayhero.perfect{background:radial-gradient(120% 90% at 100% 0%,rgba(255,200,60,.24),transparent 60%),var(--card)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.greet{color:var(--text-2);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-num .of{font-size:22px;color:var(--text-2);font-weight:700;letter-spacing:0}
.tag.gold{background:var(--gold-bg);color:var(--gold-ink)}
.stars{letter-spacing:1px;color:#f5b400}.stars i{font-style:normal;color:var(--edge)}
.ring.full{filter:drop-shadow(0 0 10px rgba(255,200,60,.35))}
.streak{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--streak);border:1px solid var(--streak-line);font-size:16px;flex:none}
.streak b{font-weight:800}
.streak.on{background:linear-gradient(135deg,var(--streak-on-a),var(--streak-on-b));border-color:var(--streak-on-line);box-shadow:0 0 20px rgba(255,120,30,.2)}
.streak.pulse{animation:chipPulse 1.1s ease-out}
@keyframes chipPulse{0%{box-shadow:0 0 0 0 rgba(255,140,40,.65)}100%{box-shadow:0 0 0 18px rgba(255,140,40,0)}}
.flame{display:inline-block;position:relative;flex:none;line-height:0}
.flame svg{width:100%;height:100%;overflow:visible}
.flame .fo,.flame .fi{transform-box:fill-box;transform-origin:50% 100%}
.flame.lit .fo{animation:flk 1.7s ease-in-out infinite}
.flame.lit .fi{animation:flk2 1.05s ease-in-out infinite}
.flame.lit{filter:drop-shadow(0 0 5px rgba(255,130,30,.6))}
.flame.lv2.lit{filter:drop-shadow(0 0 8px rgba(255,90,20,.75))}
.flame.lv3.lit{filter:drop-shadow(0 0 8px rgba(80,170,255,.75))}
.flame.dim{opacity:.5;filter:saturate(.5)}
.flame.dim .fo{animation-duration:3.2s}
.flame.ignite{animation:ign .95s cubic-bezier(.2,1.5,.4,1)}
@keyframes flk{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.96,1.06) skewX(-2.5deg)}50%{transform:scale(1.03,.95) skewX(2deg)}75%{transform:scale(.98,1.04) skewX(-1deg)}}
@keyframes flk2{0%,100%{transform:scale(1)}50%{transform:scale(.88,1.12)}}
@keyframes ign{0%{transform:scale(.2);filter:brightness(3) drop-shadow(0 0 12px #ffb040)}55%{transform:scale(1.4)}100%{transform:scale(1)}}
.tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 20%,transparent);color:var(--tc);transition:opacity .3s,filter .3s}
.tic svg{width:20px;height:20px}
.task.done .tic{opacity:.45;filter:saturate(.3)}
.task .mid{flex:1;min-width:0}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:0}
.chk.just-on{animation:chkPop .5s cubic-bezier(.2,1.6,.4,1)}
.chk.just-on svg path{animation:chkDraw .38s .1s ease-out both}
.chk.just-on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #5fd48a;animation:chkRing .65s ease-out forwards;pointer-events:none}
@keyframes chkPop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes chkDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes chkRing{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
.task.just .t{animation:doneNudge .45s ease-out}
@keyframes doneNudge{40%{transform:translateX(5px)}100%{transform:none}}
.kv-ic span{display:flex;align-items:center;gap:6px}
.kv-ic span svg{width:14px;height:14px;opacity:.85}
.set{transition:border-color .3s,background .3s}
.set.pr{border-color:var(--pr-line);background:var(--pr-bg)}
.set.pr > span:first-child{color:var(--gold-ink);display:grid}
.set.pr > span:first-child svg{width:14px;height:14px}
.sw{width:46px;height:28px;accent-color:var(--accent);flex:none}
.scrim.enter{animation:fadeIn .22s ease-out}
.scrim.enter .sheet{animation:sheetUp .36s cubic-bezier(.2,.9,.25,1)}
.scrim.leave{animation:fadeOut .2s ease-in forwards}
.scrim.leave .sheet{animation:sheetDown .2s ease-in forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
.view.tab-in > *{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.view.tab-in > *:nth-child(2){animation-delay:.03s}.view.tab-in > *:nth-child(3){animation-delay:.06s}.view.tab-in > *:nth-child(4){animation-delay:.09s}.view.tab-in > *:nth-child(5){animation-delay:.12s}.view.tab-in > *:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.shelf{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf-b{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;flex:none;text-align:center;font-size:11.5px;color:var(--text-2);line-height:1.2;font-weight:600}
.shelf-b small{font-size:11px;color:var(--text-3);font-weight:500}
.badge-ic{border-radius:50%;display:grid;place-items:center;background:var(--badge-off);color:var(--edge);position:relative;border:2px solid var(--badge-line);overflow:hidden;line-height:0}
.badge-ic > svg{width:44%;height:44%}
.badge-ic.on{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--bc) 70%,#fff 15%),color-mix(in srgb,var(--bc) 45%,#000) 75%);color:#fff;border-color:color-mix(in srgb,var(--bc) 75%,#fff 10%);box-shadow:0 6px 18px color-mix(in srgb,var(--bc) 30%,transparent)}
.badge-ic.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);background-size:260% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,62%{background-position:160% 0}100%{background-position:-60% 0}}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:18px 8px}
.badge-grid .shelf-b{width:auto}
.badge-show{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.badge-show.fresh .badge-ic{animation:badgeIn .95s cubic-bezier(.2,1.4,.4,1)}
@keyframes badgeIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.flame .fo,.flame .fi,.badge-ic.on::after,.chk.just-on,.chk.just-on svg path,.chk.just-on::after,.view.tab-in>*,.scrim.enter,.scrim.enter .sheet,.scrim.leave,.scrim.leave .sheet,.toast,.flame.ignite,.badge-show.fresh .badge-ic,.streak.pulse,.task.just .t{animation:none!important}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.aibtn{position:relative}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.seg button[disabled]{opacity:.35}
.spin{animation-duration:3s}.chk{transition:none}}
.src a{color:var(--accent);text-decoration:none}
.src li{margin-bottom:8px}

/* v2 */
.chk::before{content:"";position:absolute;inset:-7px}
.tl-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-radius:14px}
.tl-row + .tl-row,.tl-det + .tl-row{border-top:1px solid var(--line)}
.tl-time{width:44px;flex:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tl-time small{display:block;font-weight:500;color:var(--text-3);font-size:12px}
.tl-row .mid{flex:1;min-width:0;text-align:left;padding:2px 0}
.tl-row .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tl-row .s{color:var(--text-2);font-size:13px;margin-top:1px}
.tl-note{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tl-row.done .t{color:var(--text-3);text-decoration:line-through}
.tl-row.done .tic{opacity:.45;filter:saturate(.3)}
.tl-row.skip{opacity:.45}
.tl-row.now{background:var(--accent-soft);margin:0 -10px;padding:10px;border-top-color:transparent}
.tl-row.now + .tl-row{border-top-color:transparent}
.tl-det{padding:2px 0 12px 54px;color:var(--text-2);font-size:14px;display:flex;flex-direction:column;gap:10px}
.tl-det .btn{padding:10px 12px;font-size:14px;flex:0 1 auto}
.tl-ev{display:flex;gap:10px;align-items:flex-start;background:var(--ev-bg);color:var(--ev-ink);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.tl-ev svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--c7)}
.tl-ev .s{color:var(--sick-ink);font-size:13px;margin-top:2px}
.tl-walk{display:flex;flex-direction:column;gap:8px}
.tl-walk-h{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tl-walk-h span{display:flex;gap:8px;align-items:center;color:var(--text-2)}
.tl-walk-h svg{width:18px;height:18px;color:var(--c3)}
.tl-past{display:block}
.progrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.prog{display:block;width:100%;border:2px solid transparent}
.prog.on{border-color:var(--accent)}
.srows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sr-h,.sr{display:grid;grid-template-columns:34px 1fr 74px 74px;gap:8px;align-items:center}
.sr-h{font-size:12px;color:var(--text-3);font-weight:600;text-align:center}
.sr{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px 8px 4px 6px;min-height:46px;transition:border-color .3s,background .3s}
.sr .sn{color:var(--text-3);font-weight:700;text-align:center;display:grid;place-items:center}
.sr .sn svg{width:16px;height:16px}
.sr .sp{color:var(--text-2);font-size:14px;text-align:center;border-radius:10px;padding:10px 4px;min-height:44px;font-variant-numeric:tabular-nums}
.sr button.sp{background:var(--card-2);color:var(--text)}
.sr .sp.none{color:var(--text-3)}
.sr input{width:100%;min-height:44px;background:var(--sunk-2);border:0;border-radius:10px;text-align:center;font-weight:700;font-size:16px;outline:none;color:var(--text)}
.sr input:focus{box-shadow:0 0 0 2px var(--accent)}
.sr.pr{border-color:var(--pr-line);background:var(--pr-bg)}
.sr.pr .sn{color:var(--gold-ink)}
.wlogo{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 2px;text-align:center}
.wlogo img{height:auto}

/* v3 */
.acc{padding:0;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:64px}
.acc-h.bare{padding:14px 16px}
.acc-h .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.acc-h .ic svg{width:21px;height:21px}
.acc-h .mid{flex:1;min-width:0}
.acc-h .t{font-weight:700;font-size:16px}
.acc-h .s{color:var(--text-2);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.acc-c{color:var(--text-3);display:grid;place-items:center;transition:transform .25s}
.acc-c svg{width:20px;height:20px}
[aria-expanded=true] > .acc-c{transform:rotate(90deg);color:var(--accent)}
.acc-b{padding:2px 16px 18px;display:flex;flex-direction:column;gap:12px;animation:accIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.profhead{display:flex;align-items:center;gap:14px}
.ava.big{width:56px;height:56px;font-size:24px}
.profhead .mid{flex:1;min-width:0}
.nudge,.navrow,.onbc{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.firstc{display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,var(--green-bg),var(--mat,var(--card)) 60%)}
.firstc h2{margin:0;font-size:19px}
.firstc .pill{white-space:normal;text-align:left;max-width:100%}
.firstc .link{align-self:center;padding:8px 12px;min-height:44px}
.nudge{background:linear-gradient(135deg,var(--green-bg),var(--mat,var(--card)))}
.nudge .ic,.navrow .ic,.onbc .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.nudge .ic svg,.navrow .ic svg,.onbc .ic svg{width:21px;height:21px}
.nudge .mid,.navrow .mid,.onbc .mid{flex:1;min-width:0}
.nudge .t,.navrow .t,.onbc .t{font-weight:700;font-size:16px}
.nudge .s,.navrow .s,.onbc .s{color:var(--text-2);font-size:13.5px;margin-top:2px}
.navrow > svg,.onbc > svg{width:20px;height:20px;color:var(--text-3);flex:none}
.backlink{display:inline-block;margin:12px 0 -4px;color:var(--accent);font-weight:700;font-size:16px;padding:8px 0;min-height:44px}
.nowc{display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,var(--good-bg),var(--mat,var(--card)) 70%)}
.nc-l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--good-ink)}
.nc-row{display:flex;align-items:center;gap:12px}
.nc-row .mid{flex:1;min-width:0}
.nowc .t{font-weight:700;font-size:18px}
.nowc .s{color:var(--text-2);font-size:14px;margin-top:2px}
.nc-next{font-size:14px;color:var(--text-2);border-top:1px solid var(--fill);padding-top:10px}
.nc-next b{color:var(--text)}
.nc-next span{color:var(--text-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li > span{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.steps li > div{flex:1;min-width:0;font-size:15px;line-height:1.4}
.okbig{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#2ebd6b,#7bd64a);color:#04140a;display:grid;place-items:center}
.okbig svg{width:34px;height:34px}
a.btn{text-decoration:none}
.link{min-height:44px;display:inline-flex;align-items:center}
.pill{min-height:44px}
.seg button{min-height:44px}
/* small controls keep their look but get a 44pt touch area */
.iconbtn,.hname,.seasonchip,.streak,.walkq button,.nc-ext button,.link{position:relative}
.iconbtn::before,.hname::before,.seasonchip::before,.streak::before,.walkq button::before,.nc-ext button::before,.link::before{content:"";position:absolute}
.iconbtn::before{inset:-2px}
.hname::before,.seasonchip::before{inset:-8px 0}

:root{--glass:rgba(34,34,38,.56);--glass-rim:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.12);--glass-shadow:0 10px 30px rgba(0,0,0,.45)}

:root[data-theme=light]{--glass:rgba(255,255,255,.6);--glass-rim:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,.7);--glass-shadow:0 10px 30px rgba(20,30,40,.14)}
.nav,.toast,.sh-h{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
/* the tab bar floats as a capsule above the content */
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;border-radius:32px;padding:6px 4px;border-top:1px solid var(--glass-rim)}

.restbar{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast{border-radius:22px}

.sh-h{position:sticky;top:-10px;z-index:3;margin:0 -16px;padding:10px 16px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sh-h{background:var(--card)}}
@media (prefers-reduced-transparency:reduce){.sh-h{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}

.sso{min-height:50px;font-weight:600;font-size:17px;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;gap:8px;background:var(--card-2);color:var(--text)}

/* liquid glass, second pass: sheets float as frosted panels inset from the edges */

/* the KAI button: a lit glass bead */
.nav .mic span.b{background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--accent) 70%,#fff 30%),var(--accent) 60%);border:1px solid rgba(255,255,255,.35)}
@media (prefers-reduced-transparency:reduce){.sheet,.view > .pills:first-child{background:var(--sheet);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* the grab bar and title can be pulled down; a bigger target than the 5px bar */

/* ============ Liquid Glass, third pass (iOS 26) ============
   As Apple's HIG puts it: glass is the floating layer for navigation and controls (tab bar, header buttons, sheets,
   toasts); content sits on a lighter standard material; the page carries soft colour for the glass to pick up,
   with a hue per section. Reduce Transparency, Increase Contrast and Reduce Motion each turn the effects down. */
@property --hue1{syntax:"<color>";inherits:true;initial-value:transparent}
@property --hue2{syntax:"<color>";inherits:true;initial-value:transparent}
@property --hue3{syntax:"<color>";inherits:true;initial-value:transparent}
:root{
  --mat:rgba(30,30,34,.72);--mat-line:rgba(255,255,255,.07);--mat-drop:0 0 #0000;
  --lg-tint:rgba(48,48,54,.36);--lg-tint-strong:rgba(40,40,46,.7);--lg-tint-thick:rgba(32,32,38,.95);--lg-press:rgba(76,76,84,.55);
  --lg-hi:rgba(255,255,255,.34);--lg-lo:rgba(255,255,255,.10);--lg-line:rgba(255,255,255,.10);--lg-glow:rgba(255,255,255,.06);
  --lg-sheen:rgba(255,255,255,.10);--lg-touch:rgba(255,255,255,.26);
  --lg-drop:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --lg-sel:rgba(255,255,255,.15);--lg-sel-hi:rgba(255,255,255,.3);
  --edge-c:rgba(0,0,0,.66);--edge-c0:rgba(0,0,0,0);--edge-bc:rgba(0,0,0,.42);
  --fill-1:rgba(120,120,128,.26);--fill-hi:rgba(255,255,255,.10);
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --mat:rgba(255,255,255,.7);--mat-line:rgba(255,255,255,.85);--mat-drop:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);
  --lg-tint:rgba(255,255,255,.32);--lg-tint-strong:rgba(255,255,255,.78);--lg-tint-thick:rgba(250,250,252,.95);--lg-press:rgba(255,255,255,.66);
  --lg-hi:rgba(255,255,255,.98);--lg-lo:rgba(255,255,255,.6);--lg-line:rgba(255,255,255,.6);--lg-glow:rgba(255,255,255,.4);
  --lg-sheen:rgba(255,255,255,.42);--lg-touch:rgba(255,255,255,.85);
  --lg-drop:0 12px 32px rgba(30,40,60,.16),0 2px 6px rgba(30,40,60,.08);
  --lg-sel:rgba(255,255,255,.9);--lg-sel-hi:#fff;
  --edge-c:rgba(242,242,247,.82);--edge-c0:rgba(242,242,247,0);--edge-bc:rgba(242,242,247,.4);
  --fill-1:rgba(120,120,128,.13);--fill-hi:rgba(255,255,255,.75);--nav-ink:#575a61;}}
:root[data-theme=light]{
  --mat:rgba(255,255,255,.7);--mat-line:rgba(255,255,255,.85);--mat-drop:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);
  --lg-tint:rgba(255,255,255,.32);--lg-tint-strong:rgba(255,255,255,.78);--lg-tint-thick:rgba(250,250,252,.95);--lg-press:rgba(255,255,255,.66);
  --lg-hi:rgba(255,255,255,.98);--lg-lo:rgba(255,255,255,.6);--lg-line:rgba(255,255,255,.6);--lg-glow:rgba(255,255,255,.4);
  --lg-sheen:rgba(255,255,255,.42);--lg-touch:rgba(255,255,255,.85);
  --lg-drop:0 12px 32px rgba(30,40,60,.16),0 2px 6px rgba(30,40,60,.08);
  --lg-sel:rgba(255,255,255,.9);--lg-sel-hi:#fff;
  --edge-c:rgba(242,242,247,.82);--edge-c0:rgba(242,242,247,0);--edge-bc:rgba(242,242,247,.4);
  --fill-1:rgba(120,120,128,.13);--fill-hi:rgba(255,255,255,.75);--nav-ink:#575a61;}

/* the page: soft colour that changes with the section */
body{--hue1:rgba(46,189,107,.34);--hue2:rgba(57,135,229,.28);--hue3:rgba(144,133,233,.26);transition:--hue1 .9s ease,--hue2 .9s ease,--hue3 .9s ease}
body[data-tab=health]{--hue1:rgba(255,95,126,.27);--hue2:rgba(46,189,107,.22);--hue3:rgba(255,162,76,.22)}
body[data-tab=money]{--hue1:rgba(245,184,46,.27);--hue2:rgba(37,181,168,.22);--hue3:rgba(144,133,233,.18)}
body[data-tab=more],body[data-tab=content]{--hue1:rgba(122,108,240,.28);--hue2:rgba(58,142,230,.22);--hue3:rgba(196,107,224,.18)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(75% 42% at 0% 0%,var(--hue1),transparent 72%),
  radial-gradient(60% 38% at 100% 14%,var(--hue2),transparent 72%),
  radial-gradient(70% 44% at 100% 100%,var(--hue3),transparent 72%),
  radial-gradient(60% 40% at 0% 72%,var(--hue2),transparent 74%)}

/* glass: a light tint, blur and extra colour from what is beneath, a bright rim that catches the light,
   an inner glow at the edges where real glass bends light, and a soft shadow */
.lg,.nav,.toast,.rb-in{
  background:linear-gradient(180deg,var(--lg-sheen),rgba(255,255,255,0) 60%),var(--lgt,var(--lg-tint));
  -webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);
  border:0;
  box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 -1px 0 var(--lg-lo),inset 0 0 0 1px var(--lg-line),inset 0 0 20px var(--lg-glow),inset 0 -10px 16px -12px var(--lg-hi),var(--lg-drop)}
.lg{position:relative;transition:transform .45s cubic-bezier(.3,1.5,.4,1)}
/* the rim is brightest where light would hit: top left, then bottom right */
.lg::after,.nav::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(150deg,var(--lg-hi),rgba(255,255,255,.08) 28%,rgba(255,255,255,0) 50%,rgba(255,255,255,.08) 72%,var(--lg-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* a touch lights the glass up from the finger and lets it swell a little, like iOS */
.lg:active{transform:scale(1.07);background:radial-gradient(circle at var(--px,50%) var(--py,50%),var(--lg-touch),rgba(255,255,255,0) 70%),linear-gradient(180deg,var(--lg-sheen),rgba(255,255,255,0) 60%),var(--lg-press)}
/* glass that carries text (toasts, the rest timer) is thicker: what scrolls beneath must not compete with the words */
.toast,.rb-in{--lgt:var(--lg-tint-thick);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.toast{border-radius:26px;border:0}
.rb-in{border-radius:30px;padding:8px 8px 8px 18px}

/* the floating header: a glass capsule for the profile, a glass circle for AI; content fades softly under it */
.top,.top.plain{background:none;padding-top:calc(70px + env(safe-area-inset-top,0px))}
.top::after{display:none}
.hdr{position:fixed;z-index:21;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;max-width:480px;margin:0 auto;padding:0 16px;pointer-events:none}
.hdr > *{pointer-events:auto}
.hpill{display:flex;align-items:center;height:48px;padding:4px;border-radius:999px;min-width:48px;max-width:calc(100% - 64px)}

body.scrolled .hpill .hx{max-width:0;opacity:0;padding:0}
.top .aibtn{width:48px;height:48px;border-radius:50%}
.htitle{position:absolute;left:50%;top:24px;transform:translate(-50%,-50%);max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
body.scrolled .htitle{opacity:1}
.edge{position:fixed;left:0;right:0;z-index:19;pointer-events:none}
.edge-t{top:0;height:calc(env(safe-area-inset-top,0px) + 118px);background:linear-gradient(180deg,var(--edge-c) 30%,var(--edge-c0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent);mask-image:linear-gradient(180deg,#000 45%,transparent);opacity:0;transition:opacity .3s}

/* the tab bar: a floating glass capsule; the selected tab sits in a lighter capsule that slides like a drop */
.nav{left:14px;right:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:452px;margin:0 auto;border-radius:999px;padding:6px;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.25,.4,1)}

.nav-ind{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / var(--nn,5));border-radius:999px;background:var(--lg-sel);box-shadow:inset 0 1px 0 var(--lg-sel-hi),0 1px 6px rgba(0,0,0,.10);transform:translateX(calc(100% * var(--ni,0)));transition:transform .55s cubic-bezier(.3,1.25,.45,1);pointer-events:none}

@keyframes navDrop{35%{scale:1.2 .86}100%{scale:1 1}}
.nav .mic span.b{transition:width .35s,height .35s,transform .15s;background:radial-gradient(90% 70% at 30% 12%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--accent);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 8px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.2),0 8px 20px -4px rgba(46,189,107,.55)}
/* scrolling down, the bar recedes to its icons; scrolling up brings it back */
body.nav-min .nav{transform:translateY(4px) scale(.94)}

/* dark pages need a little more colour for the glass to show it */
:root:not([data-theme=light]) body{--hue1:rgba(46,189,107,.40);--hue2:rgba(57,135,229,.34);--hue3:rgba(144,133,233,.32)}
:root:not([data-theme=light]) body[data-tab=health]{--hue1:rgba(255,95,126,.36);--hue2:rgba(46,189,107,.30);--hue3:rgba(255,162,76,.28)}
:root:not([data-theme=light]) body[data-tab=money]{--hue1:rgba(245,184,46,.34);--hue2:rgba(37,181,168,.32);--hue3:rgba(144,133,233,.26)}
:root:not([data-theme=light]) body:is([data-tab=more],[data-tab=content]){--hue1:rgba(122,108,240,.38);--hue2:rgba(58,142,230,.32);--hue3:rgba(196,107,224,.28)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) body{--hue1:rgba(46,189,107,.34);--hue2:rgba(57,135,229,.28);--hue3:rgba(144,133,233,.26)}
  :root:not([data-theme=dark]) body[data-tab=health]{--hue1:rgba(255,95,126,.27);--hue2:rgba(46,189,107,.22);--hue3:rgba(255,162,76,.22)}
  :root:not([data-theme=dark]) body[data-tab=money]{--hue1:rgba(245,184,46,.27);--hue2:rgba(37,181,168,.22);--hue3:rgba(144,133,233,.18)}
  :root:not([data-theme=dark]) body:is([data-tab=more],[data-tab=content]){--hue1:rgba(122,108,240,.28);--hue2:rgba(58,142,230,.22);--hue3:rgba(196,107,224,.18)}}

/* sheets: frosted glass panels, more opaque because they hold forms and text */
.sheet{background:linear-gradient(180deg,var(--lg-sheen),rgba(255,255,255,0) 160px),color-mix(in srgb,var(--sheet) 85%,transparent);border:0;box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 0 0 1px var(--lg-line),0 24px 70px rgba(0,0,0,.4)}
.sheet .sh-h{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .25s,box-shadow .25s}
.sheet.scrolled .sh-h{background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 1px 0 var(--lg-line)}

/* controls in the content layer: capsules with a lit top edge */
.btn{border-radius:24px} /* a capsule at one line; a rounded rectangle when the label wraps */
.btn:not(.ghost):not(.danger):not(.sso){background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(0,0,0,.10),0 8px 18px -8px var(--accent)}
.btn.ghost,.pill{background:var(--fill-1);box-shadow:inset 0 1px 0 var(--fill-hi),inset 0 0 0 1px var(--lg-line)}
.pill.on{background:var(--pill-on);box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.seg{background:var(--fill-1);border-radius:24px}
.seg button{border-radius:21px}
.seg button.on{box-shadow:inset 0 1px 0 var(--fill-hi),0 2px 8px rgba(0,0,0,.14)}

/* the selected capsule of a section switcher glides to the new choice; the switcher itself stays put while the content changes */
.pills{position:relative}
.pills .pill{position:relative;z-index:1}
.pill-ghost{position:absolute;z-index:0;border-radius:999px;background:var(--pill-on);box-shadow:0 4px 12px -4px rgba(0,0,0,.35);pointer-events:none;transition:transform .4s cubic-bezier(.3,1.25,.45,1),width .4s cubic-bezier(.3,1.25,.45,1)}
.pill.on.arriving{background:transparent;box-shadow:none}
.view.tab-in > .pills:first-child{animation:none}

h1,h2,h3,.t,.hero-num{text-wrap:balance} /* headings wrap into even lines, never one word alone */
p,.hint,.s{text-wrap:pretty}
#tellOut,#foodOut{scroll-margin-top:84px} /* clear of the sheet's title bar when brought into view */

/* Focus: the session bar sits where the rest timer does, above it if both run */
body.focusing .app{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
body.resting.focusing #focusBar{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
/* a toast sits above the rest and focus bars instead of covering their buttons */
body.resting .toast,body.focusing .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
body.resting.focusing .toast{bottom:calc(232px + env(safe-area-inset-bottom,0px))}
.rb-in > .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.rb-in > .ic svg{width:20px;height:20px}
.nowc > .btn{align-self:flex-start}

/* the exam card: two main actions, the rest as links */
.examc .btnrow{flex-wrap:nowrap}
.examc .btnrow .btn{flex:1 1 auto;min-width:0;padding-left:10px;padding-right:10px}
.ex-links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:2px}
.ex-links .link{min-height:36px;font-size:14px}

/* reminder groups in the Reminders sheet */
.remind-h{margin:6px 4px -4px;font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}

/* regular payments on the Money tab */
.card.bills{padding:4px 18px}
.row.bill > button.mid{text-align:left}
.btn.sm{padding:0 16px;min-height:44px;font-size:14px;border-radius:22px;flex:none}
.bill-ok{display:grid;place-items:center;width:44px;height:44px;flex:none;color:var(--good)}
.bill-ok svg{width:22px;height:22px}
.bills-left{padding:10px 0 12px;border-top:1px solid var(--line)}
.bill-idea{display:flex;flex-direction:column;gap:10px;padding:14px 0;font-size:14.5px;color:var(--text-2)}
.list + .bill-idea,.bills-left + .bill-idea{border-top:1px solid var(--line)}
.bill-link{padding:6px 0}
.bill-link > svg{width:20px;height:20px;flex:none;color:var(--text-3)}

/* rows and card buttons answer a touch the iOS way: a quick highlight for a row, a slight press for a whole card */
.acc-h{transition:background-color .15s}
.acc-h:active{background-color:var(--fill-1)}
button.card,.navrow,.onbc{transition:transform .25s cubic-bezier(.3,1.4,.4,1),background-color .15s}
button.card:active,.navrow:active,.onbc:active{transform:scale(.98)}

/* without blur, glass needs more tint to stay readable */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.lg,.nav,.toast,.rb-in{--lgt:var(--lg-tint-strong)}}
@media (prefers-reduced-transparency:reduce){
  :root,:root:not([data-theme=dark]),:root[data-theme=light]{--mat:var(--card);--lg-tint:var(--card);--lg-tint-strong:var(--card);--lg-tint-thick:var(--card);--lg-press:var(--card-2)}
  body::after,.edge{display:none}
  .lg,.nav,.toast,.rb-in,.sheet{-webkit-backdrop-filter:none;backdrop-filter:none}
  .sheet{background:var(--sheet)}}
@media (prefers-contrast:more){
  :root,:root:not([data-theme=dark]),:root[data-theme=light]{--mat:var(--card);--mat-line:var(--edge);--lg-tint:var(--card);--lg-tint-strong:var(--card);--lg-tint-thick:var(--card);--lg-line:var(--edge);--fill-1:var(--card-2)}}
</style>
</head>
